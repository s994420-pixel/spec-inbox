        function switchTab(tab) {
            const tabs = ['manual', 'auto', 'inquiry'];
            tabs.forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                el.classList.remove('tab-active');
                el.classList.add('text-gray-500');
            });
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            document.getElementById(`tab-${tab}`).classList.remove('text-gray-500');

            const actionBar = document.getElementById('action-bar');
            actionBar.style.display = (tab === 'manual') ? 'flex' : 'none';

            const triggerCol = document.getElementById('trigger-function-col');
            const statusCol = document.getElementById('status-col');
            const timeCol = document.getElementById('time-range-col');
            const accountCol = document.getElementById('member-account-col');

            if (tab === 'auto') {
                triggerCol.classList.remove('hidden');
                statusCol.classList.remove('hidden');
                // 調整欄位比例以容納五個欄位
                timeCol.className = 'md:col-span-3';
                accountCol.className = 'md:col-span-3';
            } else {
                triggerCol.classList.add('hidden');
                statusCol.classList.add('hidden');
                // 恢復原本的對稱比例
                timeCol.className = 'md:col-span-5';
                accountCol.className = 'md:col-span-5';
            }

            renderTable(tab);
        }

        // 開啟詳情彈窗
        window.openDetailModal = function(id) {
            const item = data.auto.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-recipient').innerText = item.recipient;
            document.getElementById('modal-time').innerText = item.time;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-content').innerText = item.content;

            const modal = document.getElementById('detail-modal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // 關閉詳情彈窗
        window.closeModal = function() {
            const modal = document.getElementById('detail-modal');
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function renderTable(tab) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            const totalCount = document.getElementById('total-count');
            
            tbody.innerHTML = '';
            totalCount.innerText = `共 ${data[tab].length} 條記錄`;

                    <th class="px-4 py-4 font-semibold">主題</th>
                    <th class="px-4 py-4 font-semibold w-48">發送時間</th>
                    <th class="px-4 py-4 font-semibold w-24 text-center">狀態</th>
                    <th class="px-4 py-4 font-semibold w-32 text-center">功能</th>
                `;
                data.manual.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-blue-50/30 transition-colors">
                            <td class="px-4 py-4 text-center font-mono text-gray-400">${item.id.toString().padStart(2, '0')}</td>
                            <td class="px-4 py-4"><span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs font-medium border border-blue-100">${item.recipient}</span></td>
                            <td class="px-4 py-4 font-medium">${item.sender}</td>
                            <td class="px-4 py-4">${item.subject}</td>
                            <td class="px-4 py-4 text-gray-400 text-xs">${item.time}</td>
                            <td class="px-4 py-4 text-center"><span class="bg-green-50 px-2 py-1 rounded text-green-600 text-xs border border-green-100 font-medium">${item.status}</span></td>
                            <td class="px-4 py-4 text-center space-x-3">
                                <button class="text-blue-500 hover:text-blue-700 transition-colors"><i class="far fa-eye mr-1"></i>查看</button>
                                <button class="text-red-400 hover:text-red-600 transition-colors"><i class="far fa-trash-alt mr-1"></i>刪除</button>
                            </td>
                        </tr>
                    `;
                });
            } else if (tab === 'auto') {
                thead.innerHTML = `
                    <th class="px-6 py-4 font-semibold w-40">功能</th>
                    <th class="px-6 py-4 font-semibold w-48">訊息標題</th>
                    <th class="px-6 py-4 font-semibold">收件會員</th>
                    <th class="px-6 py-4 font-semibold w-56">發送時間</th>
                    <th class="px-6 py-4 font-semibold w-24 text-center">狀態</th>
                    <th class="px-6 py-4 font-semibold w-24 text-center">功能</th>
                `;
                data.auto.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-blue-50/30 transition-colors">
                            <td class="px-6 py-4 font-semibold text-blue-600">${item.function}</td>
                            <td class="px-6 py-4 font-medium">${item.title}</td>
                            <td class="px-6 py-4"><span class="text-gray-800 font-medium">${item.recipient}</span></td>
                            <td class="px-6 py-4 text-gray-400 text-xs">${item.time}</td>
                            <td class="px-6 py-4 text-center"><span class="bg-blue-50 px-2 py-1 rounded text-blue-600 text-xs border border-blue-100 font-medium">${item.status}</span></td>
                            <td class="px-6 py-4 text-center"><button onclick="openDetailModal(${item.id})" class="text-blue-500 hover:underline font-medium">詳情</button></td>
                        </tr>
                    `;
                });
            } else {
                thead.innerHTML = `
                    <th class="px-4 py-4 font-semibold text-center w-16">No.</th>
                    <th class="px-4 py-4 font-semibold">發問會員</th>
                    <th class="px-4 py-4 font-semibold">諮詢主題</th>
                    <th class="px-4 py-4 font-semibold w-48">諮詢時間</th>
                    <th class="px-4 py-4 font-semibold w-24 text-center">狀態</th>
                    <th class="px-4 py-4 font-semibold w-32 text-center">功能</th>
                `;
                data.inquiry.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-blue-50/30 transition-colors">
                            <td class="px-4 py-4 text-center font-mono text-gray-400">${item.id.toString().padStart(2, '0')}</td>
                            <td class="px-4 py-4 font-semibold text-gray-700">${item.sender}</td>
                            <td class="px-4 py-4">${item.subject}</td>
                            <td class="px-4 py-4 text-gray-400 text-xs">${item.time}</td>
                            <td class="px-4 py-4 text-center"><span class="bg-orange-50 text-orange-500 border-orange-200 px-2 py-1 rounded text-xs border font-medium">${item.status}</span></td>
                            <td class="px-4 py-4 text-center"><button class="bg-blue-500 text-white px-4 py-1 rounded-full text-xs hover:bg-blue-600 transition-all shadow-sm">回覆</button></td>
                        </tr>
                    `;
                });
            }
        }

        window.onload = () => renderTable('manual');
    </script>
</body>
</html>
